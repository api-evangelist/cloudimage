description: >-
  FinOps view of Cloudimage (by Scaleflex) spend. Cloudimage bills on a
  subscription tier (Essential / Grow / Scale / Enterprise) that bundles a
  monthly CDN traffic (bandwidth) allowance, cloud storage, and a yearly
  allowance of AI visual operations. The dominant variable cost is delivered CDN
  traffic, with per-GB overage above the plan allowance (rate decreases on
  higher tiers). Cloudimage does not bill per image or per standard
  transformation - master/source image count is uncapped within fair use.
notes: >-
  Per-GB overage rates and plan allowances are subject to change; verify against
  the Cloudimage pricing page during reconciliation. Optimizing format (WebP/AVIF)
  and compression directly reduces delivered bytes and therefore CDN-traffic spend.
