meters:
- name: cdn_traffic_gb
  description: Delivered CDN traffic (bandwidth) in GB; included up to the plan allowance, then billed per GB.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
  - plan
- name: cloud_storage_gb
  description: Cloud storage consumed in the Filerobot DAM, included up to the plan allowance.
  unit: gigabytes
  aggregation: max
  dimensions:
  - account
  - plan
- name: visual_operations
  description: AI/visual-AI operations (background removal, auto-tagging, etc.) drawn from the yearly allowance.
  unit: operations
  aggregation: sum
  dimensions:
  - account
  - operation
- name: subscription_fee
  description: Recurring monthly (or annual) subscription fee for the selected plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track delivered CDN traffic against the plan allowance; watch for overage GB and storage growth.
- name: Allocation
  description: Use separate tokens/projects per app or brand to attribute bandwidth and storage to cost centers.
- name: Optimization
  description: Serve WebP/AVIF and tune quality (q) to cut delivered bytes; right-size images with the URL API and lean on CDN caching to reduce origin pulls and traffic.
- name: Accountability
  description: Assign plan owners; review monthly CDN-traffic overage and yearly visual-operation burn against budget.
