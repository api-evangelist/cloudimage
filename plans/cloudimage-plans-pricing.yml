- Transformation
- DAM
- Plans
description: >-
  Cloudimage (by Scaleflex) prices on monthly CDN traffic (bandwidth) plus
  included cloud storage and a yearly allowance of AI "visual operations".
  Cloudimage does not charge for the number of optimized images or standard
  transformations - billing is driven by delivered CDN traffic, with per-GB
  overage above each tier. Three published tiers (Essential, Grow, Scale) plus
  custom Enterprise. A free trial and POC option are available.
notes: >-
  Prices shown in EUR as published on the Cloudimage pricing page; verify the
  current tiers, allowances, and overage rates against the live page during
  reconciliation. Annual commitments are discounted vs. monthly.
sources:
- https://www.cloudimage.io/en/pricing
- https://docs.cloudimage.io/
